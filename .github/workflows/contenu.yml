# Envoie à l'Almanach les pages écrites dans le dossier contenu/ (par le Claude d'un membre ou à la main),
# depuis n'importe quelle branche : chaque session Claude pousse sur la sienne.
# La fonction « docs-sync » vérifie le jeton OIDC de GitHub (ce dépôt, cette action) et que le compte GitHub
# qui a poussé est relié à un membre de Tsuki : aucun secret à configurer. Seuls les collaborateurs du dépôt
# peuvent pousser. Une page modifiée sur le site entre-temps n'est jamais écrasée : le texte arrive en
# proposition dans l'espace équipe.
name: Contenu

on:
  push:
    branches: ['**']
    paths: ['contenu/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: almanach-contenu
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Envoi des pages modifiées
        env:
          AVANT: ${{ github.event_name == 'push' && github.event.before || '0' }}
          PRINCIPALE: ${{ github.event.repository.default_branch }}
          ALMANACH_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          # Nouvelle branche (ou historique réécrit) : on compare au point de départ sur la branche principale.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && { [ -z "${AVANT//0/}" ] || ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; }; then
            AVANT=$(git merge-base HEAD "origin/$PRINCIPALE" 2>/dev/null || echo 0)
          fi
          echo "Fichiers modifiés depuis : $AVANT"
          node scripts/sync-contenu.ts --depuis "$AVANT"

      - name: Mise en ligne des pages pré-rendues
        env:
          GH_TOKEN: ${{ github.token }}
          PRINCIPALE: ${{ github.event.repository.default_branch }}
        run: gh workflow run site.yml --ref "$PRINCIPALE"
