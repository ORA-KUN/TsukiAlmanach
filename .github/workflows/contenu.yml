# Envoie à l'Almanach les pages écrites dans le dossier contenu/ (par Claude ou à la main).
# La fonction « docs-sync » vérifie le jeton OIDC de GitHub (ce dépôt, cette branche, cette action) :
# aucun secret à configurer. Une page modifiée sur le site entre-temps n'est jamais écrasée :
# le texte arrive en proposition dans l'espace équipe.
name: Contenu

on:
  push:
    branches: [claude/project-thread-jhto3d]
    paths: ['contenu/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: almanach-contenu
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Envoi des pages modifiées
        env:
          AVANT: ${{ github.event_name == 'push' && github.event.before || '0' }}
          ALMANACH_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: node scripts/sync-contenu.ts --depuis "$AVANT"

      - name: Mise en ligne des pages pré-rendues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref "$GITHUB_REF_NAME"
